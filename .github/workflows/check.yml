name: Matcha restock check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matcha
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check stock
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          WATCH_KEYWORDS: ${{ vars.WATCH_KEYWORDS }}
        run: python matcha_tracker.py
      - name: Save state
        run: |
          git config user.name "matcha-bot"
          git config user.email "matcha-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update stock state" && git push)
